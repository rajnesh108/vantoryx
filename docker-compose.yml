services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: vantoryx
    ports:
      - "5432:5432"
    volumes:
      - vantoryx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d vantoryx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vantoryx_pg:
